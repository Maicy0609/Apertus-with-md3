name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Report and install Android SDK packages
        run: |
          set -x
          sdkmanager --list_installed || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-37" || \
            echo "::warning title=SDK::platforms;android-37 is not published in this SDK channel"
          sdkmanager --list_installed || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace --no-daemon

      - name: Verify the built APK
        run: |
          set -euo pipefail
          APK=$(find composeApp/build/outputs/apk -name '*.apk' -print -quit)
          echo "APK=$APK"
          test -n "$APK"
          ls -l "$APK"
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -name aapt2 -print -quit 2>/dev/null || true)
          echo "aapt2: $AAPT2"
          if [ -n "$AAPT2" ]; then
            echo "--- badging: launchable activity ---"
            "$AAPT2" dump badging "$APK" | grep -E "package:|launchable-activity" || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: melody-debug-apk
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore

  smoke-test:
    name: Launch smoke test (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: melody-debug-apk
          path: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning title=KVM::/dev/kvm not available"

      - name: Install, launch and watch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: smoke/
          if-no-files-found: warn
